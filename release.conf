# pgbx release config for scripts/release-local.sh (no GitHub Actions: owner rule 3, 2026-10-15). Run on the Mac only,
# never on deemwar-dev-agent. Needs OrbStack (throwaway Ubuntu 22.04 VMs for the Linux assets) and gh. Versions stay 0.x.
# Before running, commit the release prep (as for every pgbx release so far):
#   Cargo.toml + cli/Cargo.toml version = X.Y.Z, a "## X.Y.Z" CHANGELOG.md entry, sql/pgbx--<last>--X.Y.Z.sql
#   DRY_RUN=1 scripts/release-local.sh patch   then   scripts/release-local.sh patch
# Assets, names unchanged from release.yml (installers use releases/latest/download/<asset>): 12 extension tarballs
# (pg13-18 x amd64/arm64), pgbx-linux-{amd64,arm64}.tar.gz, pgbx-darwin-arm64.tar.gz, pgbx-windows-amd64.zip, SHA256SUMS.
REPO=deemwar-products/pgbx
TEST_CMD="cargo test --locked --manifest-path cli/Cargo.toml"
MIN_ASSETS=18   # 16 archives + SHA256SUMS + the template's checksums.txt

build() {
  local v=${next#v} prev=${last#v} arch vm pids="" logs=""
  # release prep must be committed: the version is compiled in from Cargo.toml (CARGO_PKG_VERSION)
  for f in Cargo.toml cli/Cargo.toml; do
    [ "$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)" = "$v" ] || die "$f version is not $v (commit the release prep first)"
  done
  grep -q "^## $v\$" CHANGELOG.md || die "CHANGELOG.md has no '## $v' entry"
  [ -f "sql/pgbx--$prev--$v.sql" ] || die "missing sql/pgbx--$prev--$v.sql (the extension upgrade script, may be empty)"
  command -v orb >/dev/null || die "OrbStack (orb) is needed for the Linux assets"

  # macOS CLI, here on the Mac (Apple silicon only; Intel Macs build from source)
  local name=pgbx-darwin-arm64 out; out=$(mktemp -d)/$name; mkdir -p "$out/adapters"
  rustup target add aarch64-apple-darwin >/dev/null 2>&1 || true
  cargo build --release --locked --manifest-path cli/Cargo.toml --target aarch64-apple-darwin
  cp cli/target/aarch64-apple-darwin/release/pgbx "$out/"; cp LICENSE "$out/"; echo "$v" > "$out/VERSION"
  cp -R adapters/README.md adapters/lib adapters/ssh adapters/aws adapters/gcp adapters/azure "$out/adapters/"
  "$out/pgbx" --version | grep -q "$v" || die "$name: pgbx --version does not show $v"
  tar -C "$(dirname "$out")" -czf "dist/$name.tar.gz" "$name"

  # Linux (+ Windows from amd64): one throwaway Ubuntu 22.04 VM per arch, in parallel, deleted afterwards
  for arch in amd64 arm64; do
    vm=pgbx-rel-$arch-$$; logs="$logs dist/build-$arch.log"
    ( orb create --arch "$arch" ubuntu:jammy "$vm" >/dev/null &&
      orb -m "$vm" bash "$PWD/scripts/release-linux.sh" "$next" "$arch"; rc=$?; orb delete -f "$vm" >/dev/null 2>&1; exit $rc
    ) > "dist/build-$arch.log" 2>&1 & pids="$pids $!"
  done
  for p in $pids; do wait "$p" || die "a Linux build failed: see$logs"; done
  mkdir -p "${TMPDIR:-/tmp}/pgbx-release-logs" && mv dist/build-*.log "${TMPDIR:-/tmp}/pgbx-release-logs/"   # logs are not assets
  [ "$(ls dist/pgbx-* | wc -l | tr -d ' ')" = 16 ] || die "dist/ has $(ls dist/pgbx-* | wc -l | tr -d ' ') archives, want 16"
  (cd dist && { command -v sha256sum >/dev/null && sha256sum pgbx-* || shasum -a 256 pgbx-*; } > SHA256SUMS)
}

verify_extra() { # the published SHA256SUMS is the one built here, and installers' 'latest' redirect now points at it
  local u
  for u in "download/$next" "latest/download"; do
    [ "$(curl -fsSL "https://github.com/$REPO/releases/$u/SHA256SUMS")" = "$(cat dist/SHA256SUMS)" ] || die "releases/$u/SHA256SUMS differs from dist/"
    echo "  releases/$u/SHA256SUMS: = built"
  done
}
